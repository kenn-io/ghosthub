[workspace]
members = ["app", "model", "ui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[workspace.dependencies]
ghosthub-model = { path = "model", version = "=0.0.0" }
ghosthub-ui = { path = "ui", version = "=0.0.0" }
gpui = { version = "=0.2.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
