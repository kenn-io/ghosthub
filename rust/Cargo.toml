[workspace]
members = [
    "app",
    "architecture",
    "config",
    "contracts",
    "host",
    "input",
    "model",
    "session",
    "surface",
    "terminal",
    "ui",
    "workspace",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.96"

[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
cargo_metadata = "=0.23.0"
crossbeam-channel = "=0.5.15"
ghosthub-contracts = { path = "contracts", version = "=0.0.0" }
ghosthub-config = { path = "config", version = "=0.0.0" }
ghosthub-host = { path = "host", version = "=0.0.0" }
ghosthub-input = { path = "input", version = "=0.0.0" }
ghosthub-model = { path = "model", version = "=0.0.0" }
ghosthub-session = { path = "session", version = "=0.0.0" }
ghosthub-surface = { path = "surface", version = "=0.0.0" }
ghosthub-terminal = { path = "terminal", version = "=0.0.0" }
ghosthub-ui = { path = "ui", version = "=0.0.0" }
ghosthub-workspace = { path = "workspace", version = "=0.0.0" }
gpui = { version = "=0.2.2", default-features = false }
portable-pty = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
