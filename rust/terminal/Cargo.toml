[package]
name = "ghosthub-terminal"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "terminal"
path = "src/lib.rs"

[features]
# Test-only observability hooks (e.g. the delivered paste-cancel probe).
# Never enabled by a production dependency edge.
test-support = []

[dependencies]
alacritty_terminal.workspace = true
crossbeam-channel.workspace = true
ghosthub-input.workspace = true
ghosthub-session.workspace = true
ghosthub-surface.workspace = true
portable-pty.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
ghosthub-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
