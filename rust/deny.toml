[graph]
targets = [
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "GPUI 0.2.2 transitively pins paste; no maintained compatible upgrade is available." },
    { id = "RUSTSEC-2025-0052", reason = "GPUI 0.2.2 transitively pins async-std; no maintained compatible upgrade is available." },
    { id = "RUSTSEC-2025-0134", reason = "GPUI 0.2.2 transitively pins rustls-pemfile; no maintained compatible upgrade is available." },
    { id = "RUSTSEC-2026-0173", reason = "GPUI 0.2.2 transitively pins proc-macro-error2; no maintained compatible upgrade is available." },
    { id = "RUSTSEC-2026-0192", reason = "GPUI 0.2.2 transitively pins ttf-parser; no maintained compatible upgrade is available." },
    { id = "RUSTSEC-2026-0206", reason = "GPUI 0.2.2 transitively pins rustybuzz; no maintained compatible upgrade is available." },
    # These standalone crates moved into zbus 6. Remove these exceptions when
    # GPUI's ashpd/oo7 dependencies migrate from zbus 5 to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "GPUI 0.2.2 requires zvariant 5 through oo7 and zbus 5; no maintained compatible upgrade is available." },
    { id = "RUSTSEC-2026-0371", reason = "GPUI 0.2.2 requires zbus_names 4 through zbus 5; no maintained compatible upgrade is available." },
    { id = "RUSTSEC-2026-0372", reason = "GPUI 0.2.2 requires zvariant_derive 5 through zvariant 5; no maintained compatible upgrade is available." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "dwrote@0.11.5" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
