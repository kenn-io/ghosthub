[project]
site_name = "Ghosthub"
site_description = "Internal engineering documentation for Ghosthub"
site_author = "Kenn Software LLC"
copyright = "Copyright &copy; 2026 Kenn Software LLC. AGPL-3.0."
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
nav = [
  {"Overview" = "index.md"},
  {"Quick Start" = "quickstart.md"},
  {"Launch Profiles" = "launch-profiles.md"},
  {"Architecture" = "architecture.md"},
  {"Threat Model" = "threat-model.md"},
  {"Terminal Sessions" = "terminal-sessions.md"},
  {"Development" = "development.md"},
  {"Troubleshooting" = "troubleshooting.md"},
  {"Release" = "release.md"},
]

[project.extra]
homepage = "/"

[project.theme]
variant = "modern"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/file-code"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
