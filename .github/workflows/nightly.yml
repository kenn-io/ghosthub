name: Nightly

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the currently published source for recovery
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ghosthub-nightly
  cancel-in-progress: false

env:
  NIGHTLY_PUBLIC_BASE_URL: https://github.com/kenn-io/ghosthub-nightly/releases
  NIGHTLY_RELEASE_REPOSITORY: kenn-io/ghosthub-nightly
  RELEASE_ROOT: .dist/nightly
  LIBGHOSTTY_XCFRAMEWORK_TARGET: native
  KWT_REPOSITORY: kenn-io/kwt

jobs:
  eligibility:
    name: Check for a changed main revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.channel.outputs.eligible }}
      previous-source-sha: ${{ steps.channel.outputs.previous_source_sha }}
      previous-channel-version: ${{ steps.channel.outputs.previous_channel_version }}
      build: ${{ steps.channel.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Validate channel state
        id: channel
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
            echo "Checkout does not match the requested nightly revision." >&2
            exit 1
          fi
          build="$(git rev-list --count HEAD)"
          arguments=(
            eligibility
            --channel-url "$NIGHTLY_PUBLIC_BASE_URL/latest/download/channel.json"
            --appcast-url "$NIGHTLY_PUBLIC_BASE_URL/latest/download/appcast.xml"
            --source-sha "$source_sha"
            --build "$build"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$FORCE" == "true" ]]; then
            arguments+=(--force)
          fi
          uv run --frozen python tools/nightly_channel.py "${arguments[@]}"

  macos-nightly:
    name: Build, sign, and notarize
    if: needs.eligibility.outputs.eligible == 'true'
    needs: eligibility
    runs-on: macos-26
    timeout-minutes: 120
    environment:
      name: nightly-signing
    outputs:
      dmg-name: ${{ steps.nightly.outputs.dmg_name }}
      built-at: ${{ steps.nightly.outputs.built_at }}
      candidate-attempt: ${{ steps.nightly.outputs.candidate_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Load pinned kwt revision
        id: kwt-pin
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < KWT_REVISION)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "KWT_REVISION must contain one full Git commit." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "KWT_REF=$revision" >> "$GITHUB_ENV"

      - name: Check out pinned kwt
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.KWT_REPOSITORY }}
          ref: ${{ steps.kwt-pin.outputs.revision }}
          path: .release-inputs/kwt-source
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "This release requires an Apple Silicon runner; found $(uname -m)." >&2
            exit 1
          fi
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select Xcode 26.0.1
        shell: bash
        run: |
          XCODE_APP=/Applications/Xcode_26.0.1.app
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "Xcode 26.0.1 is not installed on the hosted runner." >&2
            ls -1 /Applications >&2
            exit 1
          fi
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .release-inputs/kwt-source/go.mod
          cache-dependency-path: .release-inputs/kwt-source/go.sum
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Install Zig 0.15.2
        shell: bash
        env:
          ZIG_VERSION: 0.15.2
          ZIG_SHA256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
        run: |
          archive="$RUNNER_TEMP/zig-${ZIG_VERSION}.tar.xz"
          install_root="$RUNNER_TOOL_CACHE/zig/${ZIG_VERSION}/arm64"
          curl --fail --silent --show-error --location \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          tar -xf "$archive" -C "$install_root" --strip-components=1
          echo "$install_root" >> "$GITHUB_PATH"
          echo "LIBGHOSTTY_ZIG=$install_root/zig" >> "$GITHUB_ENV"

      - name: Derive nightly metadata
        id: nightly
        env:
          EXPECTED_BUILD: ${{ needs.eligibility.outputs.build }}
          PREVIOUS_SOURCE_SHA: ${{ needs.eligibility.outputs.previous-source-sha }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          build="$(git rev-list --count HEAD)"
          if [[ "$source_sha" != "$GITHUB_SHA" || "$build" != "$EXPECTED_BUILD" ]]; then
            echo "Nightly source metadata changed after eligibility." >&2
            exit 1
          fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build_date="${built_at%%T*}"
          short_sha="${source_sha:0:8}"
          dmg_name="Ghosthub_Nightly_${build_date}_${short_sha}_macos_arm64.dmg"
          {
            echo "dmg_name=$dmg_name"
            echo "built_at=$built_at"
            echo "candidate_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "RELEASE_DMG_NAME=$dmg_name"
            echo "RELEASE_BUILD_VERSION=$build"
            echo "NIGHTLY_BUILD_VERSION=$build"
            echo "NIGHTLY_BUILD_AT=$built_at"
            echo "NIGHTLY_BUILD_DATE=$build_date"
            echo "NIGHTLY_SOURCE_REVISION=$source_sha"
            echo "NIGHTLY_SOURCE_SHA=$source_sha"
            echo "NIGHTLY_PREVIOUS_SOURCE_SHA=$PREVIOUS_SOURCE_SHA"
          } >> "$GITHUB_ENV"

      - name: Build pinned kwt helper
        shell: bash
        working-directory: .release-inputs/kwt-source
        run: |
          kwt_binary="$RUNNER_TEMP/kwt"
          go build -trimpath \
            -ldflags "-s -w -X go.kenn.io/kwt/internal/cmd.version=$KWT_REF" \
            -o "$kwt_binary" ./cmd/kwt
          kwt_archs="$(lipo -archs "$kwt_binary")"
          if [[ "$kwt_archs" != "arm64" ]]; then
            echo "Embedded kwt must be an arm64 Mach-O; found: $kwt_archs" >&2
            file "$kwt_binary" >&2
            exit 1
          fi
          kwt_reported="$("$kwt_binary" version)"
          echo "$kwt_reported"
          kwt_version="$(printf '%s\n' "$kwt_reported" | sed -n '1s/^kwt version //p')"
          if [[ "$kwt_reported" != *"$KWT_REF"* ]]; then
            echo "Embedded kwt does not report the pinned revision $KWT_REF:" >&2
            echo "$kwt_reported" >&2
            exit 1
          fi
          {
            echo "KWT_BINARY_PATH=$kwt_binary"
            echo "KWT_VERSION=$kwt_version"
            echo "KWT_SOURCE_REVISION=$KWT_REF"
          } >> "$GITHUB_ENV"

      - name: Prepare Apple signing credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret $name is missing." >&2
              exit 1
            fi
          done
          CERT_PATH="$RUNNER_TEMP/apple-certificate.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 -D > "$NOTARY_KEY_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/ghosthub-nightly-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 18)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          {
            echo "APPLE_CERTIFICATE_PATH=$CERT_PATH"
            echo "APPLE_NOTARY_KEY_FILE=$NOTARY_KEY_PATH"
            echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "APPLE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed and notarized nightly DMG
        env:
          RELEASE_CHANNEL: nightly
          NIGHTLY_SPARKLE_FEED_URL: https://github.com/kenn-io/ghosthub-nightly/releases/latest/download/appcast.xml
          NIGHTLY_SPARKLE_PUBLIC_ED_KEY: ${{ vars.NIGHTLY_SPARKLE_PUBLIC_ED_KEY }}
          KWT_SOURCE_DIR: ${{ github.workspace }}/.release-inputs/kwt-source
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: ./tools/build_release_dmg.sh

      - name: Generate checksums and nightly appcast
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.NIGHTLY_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.NIGHTLY_SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          cd "$RELEASE_ROOT"
          shasum -a 256 "$RELEASE_DMG_NAME" > SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          ./tools/generate_nightly_update_appcast.sh

      - name: Verify signed nightly candidate
        env:
          EXPECTED_PUBLIC_KEY: ${{ vars.NIGHTLY_SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          cd "$RELEASE_ROOT"
          shasum -a 256 -c "${RELEASE_DMG_NAME}.sha256"
          shasum -a 256 -c SHA256SUMS
          xcrun stapler validate "$RELEASE_DMG_NAME"
          spctl --assess --type open --context context:primary-signature --verbose=2 \
            "$RELEASE_DMG_NAME"
          codesign --verify --deep --strict --verbose=2 Ghosthub.app
          codesign_output="$(codesign -dv --verbose=4 Ghosthub.app 2>&1)"
          printf '%s\n' "$codesign_output"
          team_id="$(printf '%s\n' "$codesign_output" | sed -n 's/^TeamIdentifier=//p')"
          if [[ "$team_id" != "2YMZH84KR8" ]]; then
            echo "Nightly app has the wrong Apple team identifier: $team_id" >&2
            exit 1
          fi
          plist=Ghosthub.app/Contents/Info.plist
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "com.ghosthub"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$plist")" = "Ghosthub Nightly"
          test "$(plutil -extract GhosthubReleaseChannel raw -o - "$plist")" = "nightly"
          test "$(plutil -extract GhosthubSourceRevision raw -o - "$plist")" = "$GITHUB_SHA"
          test "$(plutil -extract CFBundleVersion raw -o - "$plist")" = "$NIGHTLY_BUILD_VERSION"
          test "$(plutil -extract SUFeedURL raw -o - "$plist")" = "$NIGHTLY_PUBLIC_BASE_URL/latest/download/appcast.xml"
          test "$(plutil -extract SUPublicEDKey raw -o - "$plist")" = "$EXPECTED_PUBLIC_KEY"
          release_tag="nightly-$NIGHTLY_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          expected_url="$NIGHTLY_PUBLIC_BASE_URL/download/$release_tag/$RELEASE_DMG_NAME"
          uv run --frozen python "$GITHUB_WORKSPACE/tools/verify_update_appcast.py" \
            --appcast appcast.xml \
            --info-plist "$plist" \
            --expected-url "$expected_url"

      - name: Upload verified nightly candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghosthub-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .dist/nightly/${{ steps.nightly.outputs.dmg_name }}
            .dist/nightly/${{ steps.nightly.outputs.dmg_name }}.sha256
            .dist/nightly/SHA256SUMS
            .dist/nightly/appcast.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi
          rm -f "${APPLE_CERTIFICATE_PATH:-}" "${APPLE_NOTARY_KEY_FILE:-}"

  publish-nightly:
    name: Publish verified objects
    needs:
      - eligibility
      - macos-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: nightly-signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Download verified nightly candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghosthub-nightly-${{ github.run_id }}-${{ needs.macos-nightly.outputs.candidate-attempt }}
          path: .dist/nightly

      - name: Publish nightly channel
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          RELEASE_DMG_NAME: ${{ needs.macos-nightly.outputs.dmg-name }}
          NIGHTLY_BUILD_AT: ${{ needs.macos-nightly.outputs.built-at }}
          NIGHTLY_BUILD_VERSION: ${{ needs.eligibility.outputs.build }}
          NIGHTLY_CANDIDATE_ATTEMPT: ${{ needs.macos-nightly.outputs.candidate-attempt }}
          NIGHTLY_PREVIOUS_CHANNEL_VERSION: ${{ needs.eligibility.outputs.previous-channel-version }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "NIGHTLY_RELEASE_TOKEN is required." >&2
            exit 1
          fi
          gh --version
          arguments=(
            publish
            --release-root "$RELEASE_ROOT"
            --dmg-name "$RELEASE_DMG_NAME"
            --public-base-url "$NIGHTLY_PUBLIC_BASE_URL"
            --release-repository "$NIGHTLY_RELEASE_REPOSITORY"
            --source-sha "$GITHUB_SHA"
            --build "$NIGHTLY_BUILD_VERSION"
            --built-at "$NIGHTLY_BUILD_AT"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$NIGHTLY_CANDIDATE_ATTEMPT"
            --expected-channel-version "$NIGHTLY_PREVIOUS_CHANNEL_VERSION"
          )
          uv run --frozen python tools/nightly_channel.py "${arguments[@]}"
