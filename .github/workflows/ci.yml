name: CI

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS (Apple Silicon, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.repository == 'kenn-io/ghosthub' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            vars.GHOSTHUB_CI_RUNNER_MODE == 'parallel' &&
            '[{"lane":"hosted","runner":"macos-26","advisory":false},{"lane":"self-hosted","runner":"kenn-macos-arm64-public","advisory":true}]' ||
            github.repository == 'kenn-io/ghosthub' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            vars.GHOSTHUB_CI_RUNNER_MODE == 'self-hosted' &&
            '[{"lane":"self-hosted","runner":"kenn-macos-arm64-public","advisory":false}]' ||
            '[{"lane":"hosted","runner":"macos-26","advisory":false}]'
          ) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 90
    env:
      # The bootstrap default is intentionally arm64 for developer Macs.
      # `native` builds the arm64 libghostty slice on each validation runner.
      LIBGHOSTTY_XCFRAMEWORK_TARGET: native
      GHOSTHUB_GUI_TEST_FILTER: >-
        Clipboard|Paste|TerminalYieldsKeyboardFocusWhenSheetIsAttached|ApplicationDispatchedMouseDownNotifiesPrimaryInteractionExactlyOnce|CmdVWithoutPaneSinkStaysLocal
      GHOSTHUB_WINDOW_SERVER_TEST_FILTER: >-
        TerminalYieldsKeyboardFocusWhenSheetIsAttached|ApplicationDispatchedMouseDownNotifiesPrimaryInteractionExactlyOnce|PasteboardTmuxPaneInputSinkReceivesPasteOnCmdV|CmdVWithoutPaneSinkStaysLocal

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "This job requires an Apple Silicon runner; found $(uname -m)." >&2
            exit 1
          fi
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure the test account's login shell
        shell: bash
        run: |
          # Ghosthub intentionally follows the account shell from getpwuid,
          # just like a normal terminal. Hosted runner accounts still default
          # to bash, while supported macOS user accounts default to zsh.
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            sudo chsh -s /bin/zsh "$USER"
          fi
          user_shell="$(dscl . -read "/Users/$USER" UserShell | awk '{print $2}')"
          if [[ "$user_shell" != "/bin/zsh" ]]; then
            echo "Expected /bin/zsh as the test account shell; found $user_shell." >&2
            exit 1
          fi
          echo "SHELL=/bin/zsh" >> "$GITHUB_ENV"

      - name: Select an Xcode with the Ghosthub toolchain
        shell: bash
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            XCODE_APP=/Applications/Xcode.app
          elif [[ -d /Applications/Xcode_26.0.1.app ]]; then
            XCODE_APP=/Applications/Xcode_26.0.1.app
          else
            echo "No supported Xcode installation found." >&2
            ls -1 /Applications >&2
            exit 1
          fi

          DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Configure isolated macOS test state
        shell: bash
        run: |
          umask 077
          state_root="$(mktemp -d /tmp/ghosthub-ci.XXXXXX)"
          foundation_home="$state_root/home"
          foundation_tmp="$state_root/tmp"
          mkdir -p "$foundation_home/Library/Caches" "$foundation_tmp"
          chmod 700 "$state_root" "$foundation_home" "$foundation_home/Library" \
            "$foundation_home/Library/Caches" "$foundation_tmp"
          {
            echo "GHOSTHUB_CI_STATE_ROOT=$state_root"
            echo "CFFIXED_USER_HOME=$foundation_home"
            echo "TMPDIR=$foundation_tmp"
          } >> "$GITHUB_ENV"

      - name: Install Zig 0.15.2
        shell: bash
        env:
          ZIG_VERSION: 0.15.2
          ZIG_SHA256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
        run: |
          archive="$RUNNER_TEMP/zig-${ZIG_VERSION}.tar.xz"
          install_root="$RUNNER_TOOL_CACHE/zig/${ZIG_VERSION}/arm64"
          curl --fail --silent --show-error --location \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          tar -xf "$archive" -C "$install_root" --strip-components=1
          echo "$install_root" >> "$GITHUB_PATH"
          echo "LIBGHOSTTY_ZIG=$install_root/zig" >> "$GITHUB_ENV"

      - name: Verify build prerequisites
        shell: bash
        run: |
          "$LIBGHOSTTY_ZIG" version
          go version
          uv --version
          xcrun -sdk macosx --find metal

      # Nothing else enforced the repository SwiftFormat rules, so the tree
      # had drifted from them. Checked before the build so a formatting-only
      # failure does not wait on a full compile.
      - name: Install SwiftFormat
        run: command -v swiftformat >/dev/null || brew install swiftformat

      - name: Install tmux
        run: command -v tmux >/dev/null || brew install tmux

      - name: Check Swift formatting
        run: make format-check

      - name: Build Ghosthub
        run: make build

      - name: Test libghostty bootstrap tooling
        run: make test-libghostty-bootstrap

      - name: Run Python tests
        run: make python-test

      - name: Build Swift tests
        run: swift build --build-tests

      # Runs before the long test lanes so a window-switch render
      # regression fails the build in seconds with a legible step name.
      - name: Run activation work gate
        run: >-
          sh tools/run_swift_tests.sh
          swift test --skip-build --disable-xctest
          --filter ActivationWorkGateTests

      - name: Run terminal smoke tests
        # Most AppKit/PTY tests are isolated by fixture, so parallel workers
        # shorten the runner exposure window without saturating hosted Macs.
        # Keep tests that mutate NSPasteboard.general or require the key
        # application window in the serialized GUI lane below.
        shell: bash
        run: |
          gui_test_log="$RUNNER_TEMP/gui-tests.log"
          : > "$gui_test_log"
          test_workers=2
          if [[ "${RUNNER_ENVIRONMENT:-}" == "self-hosted" ]]; then
            test_workers=8
          fi

          test_arguments=(
            swift test --skip-build --disable-swift-testing
            --filter GhosthubTerminalSmokeTests
            --skip "$GHOSTHUB_GUI_TEST_FILTER"
            --parallel --num-workers "$test_workers"
          )
          if [[ "${RUNNER_ENVIRONMENT:-}" == "self-hosted" ]]; then
            test_arguments+=(
              --skip DefaultLibghosttyShellIntegrationLoadsUserZshrc
            )
          fi

          sh tools/run_swift_tests.sh "${test_arguments[@]}" \
            2>&1 | tee -a "$gui_test_log"

      - name: Run serialized GUI terminal smoke tests
        shell: bash
        run: |
          sh tools/run_swift_tests.sh \
            swift test --skip-build --disable-swift-testing \
            --filter "$GHOSTHUB_GUI_TEST_FILTER" \
            --skip "$GHOSTHUB_WINDOW_SERVER_TEST_FILTER" \
            --no-parallel 2>&1 | tee -a "$RUNNER_TEMP/gui-tests.log"

      - name: Run trusted serialized GUI terminal smoke tests
        if: ${{ matrix.lane == 'self-hosted' }}
        uses: ./.github/actions/run-gui-terminal-tests
        with:
          filter: ${{ env.GHOSTHUB_WINDOW_SERVER_TEST_FILTER }}

      - name: Verify terminal smoke coverage
        shell: bash
        run: |
          gui_test_log="$RUNNER_TEMP/gui-tests.log"
          gui_skip_pattern='Test skipped'
          if grep -Ei "$gui_skip_pattern" "$gui_test_log"; then
            echo "Terminal smoke tests must not skip selected coverage." >&2
            exit 1
          fi

      - name: Run remaining XCTest suites
        # Keep deadline-sensitive monitor and lifecycle tests serialized.
        run: >-
          sh tools/run_swift_tests.sh
          swift test --skip-build --disable-swift-testing
          --skip GhosthubTerminalSmokeTests --no-parallel

      - name: Run Swift Testing suites
        run: >-
          sh tools/run_swift_tests.sh
          swift test --skip-build --disable-xctest --no-parallel

      - name: Run essential kwt and tmux workflows
        run: make test-essential-workflows

      - name: Remove isolated macOS test state
        if: ${{ always() && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          case "${GHOSTHUB_CI_STATE_ROOT:-}" in
            /tmp/ghosthub-ci.*) rm -rf -- "$GHOSTHUB_CI_STATE_ROOT" ;;
          esac
