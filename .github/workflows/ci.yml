name: CI

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS (Apple Silicon, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.repository == 'kenn-io/ghosthub' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            vars.GHOSTHUB_CI_RUNNER_MODE == 'parallel' &&
            '[{"lane":"hosted","runner":"macos-26","advisory":false},{"lane":"self-hosted","runner":"kenn-macos-arm64-public","advisory":true}]' ||
            github.repository == 'kenn-io/ghosthub' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            vars.GHOSTHUB_CI_RUNNER_MODE == 'self-hosted' &&
            '[{"lane":"self-hosted","runner":"kenn-macos-arm64-public","advisory":false}]' ||
            '[{"lane":"hosted","runner":"macos-26","advisory":false}]'
          ) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 90
    env:
      # The bootstrap default is intentionally arm64 for developer Macs.
      # `native` builds the arm64 libghostty slice on each validation runner.
      LIBGHOSTTY_XCFRAMEWORK_TARGET: native

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "This job requires an Apple Silicon runner; found $(uname -m)." >&2
            exit 1
          fi
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure the test account's login shell
        shell: bash
        run: |
          # Ghosthub intentionally follows the account shell from getpwuid,
          # just like a normal terminal. Hosted runner accounts still default
          # to bash, while supported macOS user accounts default to zsh.
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            sudo chsh -s /bin/zsh "$USER"
          fi
          user_shell="$(dscl . -read "/Users/$USER" UserShell | awk '{print $2}')"
          if [[ "$user_shell" != "/bin/zsh" ]]; then
            echo "Expected /bin/zsh as the test account shell; found $user_shell." >&2
            exit 1
          fi
          echo "SHELL=/bin/zsh" >> "$GITHUB_ENV"

      - name: Select an Xcode with the Ghosthub toolchain
        shell: bash
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            XCODE_APP=/Applications/Xcode.app
          elif [[ -d /Applications/Xcode_26.0.1.app ]]; then
            XCODE_APP=/Applications/Xcode_26.0.1.app
          else
            echo "No supported Xcode installation found." >&2
            ls -1 /Applications >&2
            exit 1
          fi

          DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Configure isolated macOS test state
        shell: bash
        run: |
          umask 077
          state_root="$(mktemp -d /tmp/ghosthub-ci.XXXXXX)"
          foundation_home="$state_root/home"
          foundation_tmp="$state_root/tmp"
          mkdir -p "$foundation_home/Library/Caches" "$foundation_tmp"
          chmod 700 "$state_root" "$foundation_home" "$foundation_home/Library" \
            "$foundation_home/Library/Caches" "$foundation_tmp"
          {
            echo "GHOSTHUB_CI_STATE_ROOT=$state_root"
            echo "CFFIXED_USER_HOME=$foundation_home"
            echo "TMPDIR=$foundation_tmp"
          } >> "$GITHUB_ENV"

      - name: Install Zig 0.15.2
        shell: bash
        env:
          ZIG_VERSION: 0.15.2
          ZIG_SHA256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
        run: |
          archive="$RUNNER_TEMP/zig-${ZIG_VERSION}.tar.xz"
          install_root="$RUNNER_TOOL_CACHE/zig/${ZIG_VERSION}/arm64"
          curl --fail --silent --show-error --location \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          tar -xf "$archive" -C "$install_root" --strip-components=1
          echo "$install_root" >> "$GITHUB_PATH"
          echo "LIBGHOSTTY_ZIG=$install_root/zig" >> "$GITHUB_ENV"

      - name: Verify build prerequisites
        shell: bash
        run: |
          "$LIBGHOSTTY_ZIG" version
          go version
          uv --version
          xcrun -sdk macosx --find metal

      # Nothing else enforced the repository SwiftFormat rules, so the tree
      # had drifted from them. Checked before the build so a formatting-only
      # failure does not wait on a full compile.
      - name: Install SwiftFormat
        run: command -v swiftformat >/dev/null || brew install swiftformat

      - name: Install tmux
        run: command -v tmux >/dev/null || brew install tmux

      - name: Check Swift formatting
        run: make format-check

      - name: Build Ghosthub
        run: make build

      - name: Test libghostty bootstrap tooling
        run: make test-libghostty-bootstrap

      - name: Run Python tests
        run: make python-test

      - name: Build Swift tests
        run: swift build --build-tests

      # Runs before the long test lanes so a window-switch render
      # regression fails the build in seconds with a legible step name.
      - name: Run activation work gate
        run: >-
          sh tools/run_swift_tests.sh
          swift test --skip-build --disable-xctest
          --filter ActivationWorkGateTests

      - name: Run terminal smoke tests
        # Most AppKit/PTY tests are isolated by fixture, so parallel workers
        # shorten the runner exposure window without saturating hosted Macs.
        # Keep tests that mutate NSPasteboard.general or require the key
        # application window in the serialized GUI lane below.
        shell: bash
        run: |
          gui_test_log="$RUNNER_TEMP/gui-tests.log"
          gui_test_filter='Clipboard|Paste|TerminalYieldsKeyboardFocusWhenSheetIsAttached|ApplicationDispatchedMouseDownNotifiesPrimaryInteractionExactlyOnce|CmdVWithoutPaneSinkStaysLocal'
          : > "$gui_test_log"
          test_workers=2
          if [[ "${RUNNER_ENVIRONMENT:-}" == "self-hosted" ]]; then
            test_workers=8
          fi

          test_arguments=(
            swift test --skip-build --disable-swift-testing
            --filter GhosthubTerminalSmokeTests
            --skip "$gui_test_filter"
            --parallel --num-workers "$test_workers"
          )
          if [[ "${RUNNER_ENVIRONMENT:-}" == "self-hosted" ]]; then
            test_arguments+=(
              --skip DefaultLibghosttyShellIntegrationLoadsUserZshrc
            )
          fi

          sh tools/run_swift_tests.sh "${test_arguments[@]}" \
            2>&1 | tee -a "$gui_test_log"

      - name: Run serialized GUI terminal smoke tests
        shell: bash
        env:
          GHOSTHUB_CI_LANE: ${{ matrix.lane }}
        run: |
          gui_test_filter='Clipboard|Paste|TerminalYieldsKeyboardFocusWhenSheetIsAttached|ApplicationDispatchedMouseDownNotifiesPrimaryInteractionExactlyOnce|CmdVWithoutPaneSinkStaysLocal'
          window_server_test_filter='TerminalYieldsKeyboardFocusWhenSheetIsAttached|ApplicationDispatchedMouseDownNotifiesPrimaryInteractionExactlyOnce|PasteboardTmuxPaneInputSinkReceivesPasteOnCmdV|CmdVWithoutPaneSinkStaysLocal'
          test_arguments=(
            swift test --skip-build --disable-swift-testing
            --filter "$gui_test_filter" --no-parallel
          )
          if [[ "$GHOSTHUB_CI_LANE" == "hosted" ]]; then
            test_arguments+=(--skip "$window_server_test_filter")
            sh tools/run_swift_tests.sh "${test_arguments[@]}" \
              2>&1 | tee -a "$RUNNER_TEMP/gui-tests.log"
            exit 0
          fi

          # A command-line XCTest process can connect to WindowServer on
          # macOS 26, but LaunchServices will not let it become the active
          # application. Run the serialized GUI lane beneath a short-lived
          # application so its child test process can receive key-window
          # events. The app and every output remain inside the job runtime.
          umask 077
          launcher_root="$(mktemp -d "$RUNNER_TEMP/ghosthub-gui-launcher.XXXXXX")"
          launcher_app="$launcher_root/GhosthubGUITestLauncher.app"
          launcher_executable="$launcher_app/Contents/MacOS/launcher"
          launcher_info="$launcher_app/Contents/Info.plist"
          launcher_script="$launcher_root/run-tests.sh"
          launch_controller_source="$launcher_root/LaunchController.swift"
          launch_controller="$launcher_root/launch-controller"
          launcher_bundle_identifier="io.kenn.ghosthub-ci-gui-launcher.$(/usr/bin/uuidgen)"
          launcher_pid_file="$launcher_root/launcher.pid"
          launcher_output="$launcher_root/test-output.log"
          launcher_stdout="$launcher_root/stdout.log"
          launcher_stderr="$launcher_root/stderr.log"
          result_file="$launcher_root/result"
          controller_pid=
          cleanup_started=0
          signal_status=

          # shellcheck disable=SC2329  # invoked by stop_launcher below
          verified_launcher_signal() {
            local launcher_pid=$1
            local signal_number=$2
            "$launch_controller" signal-launcher \
              "$launcher_bundle_identifier" "$launcher_app" \
              "$launcher_pid" "$signal_number"
          }

          # shellcheck disable=SC2329  # invoked by cleanup_launcher below
          stop_launcher() {
            if [[ ! -s "$launcher_pid_file" ]]; then
              return 0
            fi

            local launcher_pid
            launcher_pid="$(< "$launcher_pid_file")"
            if [[ ! "$launcher_pid" =~ ^[1-9][0-9]*$ ]]; then
              echo "Serialized GUI test launcher reported an invalid PID." >&2
              return 1
            fi
            local launcher_signal_status
            if verified_launcher_signal "$launcher_pid" 0; then
              :
            else
              launcher_signal_status=$?
              if (( launcher_signal_status == 3 )); then
                rm -f -- "$launcher_pid_file"
                return 0
              fi
              echo "Could not authenticate the serialized GUI test launcher." >&2
              return 1
            fi

            if verified_launcher_signal "$launcher_pid" 15; then
              :
            else
              launcher_signal_status=$?
              if (( launcher_signal_status == 3 )); then
                rm -f -- "$launcher_pid_file"
                return 0
              fi
              echo "Could not stop the serialized GUI test launcher." >&2
              return 1
            fi
            for _ in {1..10}; do
              if verified_launcher_signal "$launcher_pid" 0; then
                sleep 0.1
                continue
              fi
              launcher_signal_status=$?
              if (( launcher_signal_status == 3 )); then
                rm -f -- "$launcher_pid_file"
                return 0
              fi
              echo "Could not authenticate the serialized GUI test launcher." >&2
              return 1
            done
            if verified_launcher_signal "$launcher_pid" 9; then
              :
            else
              launcher_signal_status=$?
              if (( launcher_signal_status == 3 )); then
                rm -f -- "$launcher_pid_file"
                return 0
              fi
              echo "Could not kill the serialized GUI test launcher." >&2
              return 1
            fi
            for _ in {1..5}; do
              if verified_launcher_signal "$launcher_pid" 0; then
                sleep 0.1
                continue
              fi
              launcher_signal_status=$?
              if (( launcher_signal_status == 3 )); then
                rm -f -- "$launcher_pid_file"
                return 0
              fi
              echo "Could not authenticate the serialized GUI test launcher." >&2
              return 1
            done
            echo "Serialized GUI test launcher did not stop." >&2
            return 1
          }

          # shellcheck disable=SC2329  # invoked by cleanup_launcher below
          stop_controller() {
            if [[ -z "$controller_pid" ]]; then
              return 0
            fi
            if kill -0 "$controller_pid" 2>/dev/null; then
              # Keep open -W attached while the controller forwards graceful
              # cancellation to the detached Aqua application.
              kill -TERM "$controller_pid" 2>/dev/null || true
              for _ in {1..40}; do
                if ! kill -0 "$controller_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
            fi
            if kill -0 "$controller_pid" 2>/dev/null; then
              kill -KILL -- -"$controller_pid" 2>/dev/null ||
                kill -KILL "$controller_pid" 2>/dev/null || true
            fi
            wait "$controller_pid" 2>/dev/null || true
            controller_pid=
          }

          # shellcheck disable=SC2329  # invoked by the signal traps below
          handle_signal() {
            local status=$1
            if [[ -z "$signal_status" ]]; then
              signal_status=$status
            fi
            if (( cleanup_started == 0 )); then
              exit "$signal_status"
            fi
          }

          # shellcheck disable=SC2329  # invoked by the EXIT trap below
          cleanup_launcher() {
            local status=$?
            local stop_status=0
            cleanup_started=1
            set +e
            if [[ -n "$signal_status" ]]; then
              status=$signal_status
            fi
            stop_controller
            stop_launcher || stop_status=$?
            case "$launcher_root" in
              "$RUNNER_TEMP"/ghosthub-gui-launcher.*)
                rm -rf -- "$launcher_root"
                ;;
            esac
            if (( status == 0 && stop_status != 0 )); then
              status=$stop_status
            fi
            trap - EXIT INT TERM HUP
            exit "$status"
          }
          trap cleanup_launcher EXIT
          trap 'handle_signal 130' INT
          trap 'handle_signal 143' TERM
          trap 'handle_signal 129' HUP

          mkdir -p "$launcher_app/Contents/MacOS"
          cp /bin/bash "$launcher_executable"
          plutil -create xml1 "$launcher_info"
          plutil -insert CFBundleExecutable -string launcher "$launcher_info"
          plutil -insert CFBundleIdentifier \
            -string "$launcher_bundle_identifier" "$launcher_info"
          plutil -insert CFBundleName \
            -string GhosthubGUITestLauncher "$launcher_info"
          plutil -insert CFBundlePackageType -string APPL "$launcher_info"
          chmod 700 "$launcher_executable"
          codesign --force --sign - "$launcher_app"

          # Keep the reviewed `open -W` activation path, but discover the
          # uniquely identified application through NSRunningApplication so
          # cancellation never depends on the launcher publishing its own PID.
          cat > "$launch_controller_source" <<'CONTROLLER'
          import AppKit
          import Darwin
          import Foundation

          let launcherAbsentStatus: Int32 = 3

          func signalVerifiedLauncher(
              bundleIdentifier: String,
              applicationURL: URL,
              launcherPID: pid_t,
              signalNumber: Int32
          ) -> Int32 {
              let application = NSRunningApplication
                  .runningApplications(withBundleIdentifier: bundleIdentifier)
                  .first { application in
                      !application.isTerminated &&
                          application.processIdentifier == launcherPID &&
                          application.bundleURL?.standardizedFileURL == applicationURL
                  }
              guard application != nil else {
                  return launcherAbsentStatus
              }
              if kill(launcherPID, signalNumber) == 0 {
                  return 0
              }
              if errno == ESRCH {
                  return launcherAbsentStatus
              }
              return 1
          }

          if CommandLine.arguments.count == 6,
             CommandLine.arguments[1] == "signal-launcher"
          {
              let bundleIdentifier = CommandLine.arguments[2]
              let applicationURL = URL(
                  fileURLWithPath: CommandLine.arguments[3]
              ).standardizedFileURL
              guard let launcherPID = pid_t(CommandLine.arguments[4]),
                    launcherPID > 0,
                    let signalNumber = Int32(CommandLine.arguments[5]),
                    [0, SIGINT, SIGTERM, SIGHUP, SIGKILL].contains(signalNumber)
              else {
                  fputs(
                      "usage: launch-controller signal-launcher " +
                          "bundle-id app pid signal\n",
                      stderr
                  )
                  exit(2)
              }
              let status = signalVerifiedLauncher(
                  bundleIdentifier: bundleIdentifier,
                  applicationURL: applicationURL,
                  launcherPID: launcherPID,
                  signalNumber: signalNumber
              )
              if status == 1 {
                  perror("Could not signal GUI launcher")
              }
              exit(status)
          }

          final class LaunchState: @unchecked Sendable {
              let queue = DispatchQueue(label: "io.kenn.ghosthub-ci-gui-launch")
              var launcherPID: pid_t?
              var cancellationSignal: Int32?
              var cancellationStatus: Int32?
              var failure: String?
          }

          guard CommandLine.arguments.count >= 7 else {
              fputs(
                  "usage: launch-controller bundle-id app pid-file stdout stderr arguments...\n",
                  stderr
              )
              exit(2)
          }

          let bundleIdentifier = CommandLine.arguments[1]
          let applicationURL = URL(
              fileURLWithPath: CommandLine.arguments[2]
          ).standardizedFileURL
          let pidFileURL = URL(fileURLWithPath: CommandLine.arguments[3])
          let standardOutputPath = CommandLine.arguments[4]
          let standardErrorPath = CommandLine.arguments[5]
          let applicationArguments = Array(CommandLine.arguments.dropFirst(6))
          let state = LaunchState()
          let signalStatuses: [(Int32, Int32)] = [
              (SIGINT, 130),
              (SIGTERM, 143),
              (SIGHUP, 129),
          ]
          let signalSources = signalStatuses.map { signalNumber, status in
              signal(signalNumber, SIG_IGN)
              let source = DispatchSource.makeSignalSource(
                  signal: signalNumber,
                  queue: state.queue
              )
              source.setEventHandler {
                  guard state.cancellationStatus == nil else {
                      return
                  }
                  state.cancellationSignal = signalNumber
                  state.cancellationStatus = status
                  if let launcherPID = state.launcherPID {
                      _ = signalVerifiedLauncher(
                          bundleIdentifier: bundleIdentifier,
                          applicationURL: applicationURL,
                          launcherPID: launcherPID,
                          signalNumber: signalNumber
                      )
                  }
              }
              source.resume()
              return source
          }

          if let cancellationStatus = state.queue.sync(
              execute: { state.cancellationStatus }
          ) {
              exit(cancellationStatus)
          }

          let openProcess = Process()
          openProcess.executableURL = URL(fileURLWithPath: "/usr/bin/open")
          openProcess.arguments = [
              "-n", "-W",
              "-o", standardOutputPath,
              "--stderr", standardErrorPath,
              applicationURL.path,
              "--args",
          ] + applicationArguments
          do {
              try openProcess.run()
          } catch {
              fputs("Could not submit GUI launcher request: \(error)\n", stderr)
              exit(1)
          }

          withExtendedLifetime(signalSources) {
              while true {
                  let launcherPublished = state.queue.sync {
                      state.launcherPID != nil
                  }
                  if !launcherPublished {
                      let runningApplication = NSRunningApplication
                          .runningApplications(withBundleIdentifier: bundleIdentifier)
                          .first { application in
                              application.bundleURL?.standardizedFileURL == applicationURL &&
                                  application.processIdentifier > 0
                          }
                      if let runningApplication {
                          let launcherPID = runningApplication.processIdentifier
                          state.queue.sync {
                              state.launcherPID = launcherPID
                              do {
                                  try "\(launcherPID)\n".write(
                                      to: pidFileURL,
                                      atomically: true,
                                      encoding: .utf8
                                  )
                                  if let cancellationSignal = state.cancellationSignal {
                                      _ = signalVerifiedLauncher(
                                          bundleIdentifier: bundleIdentifier,
                                          applicationURL: applicationURL,
                                          launcherPID: launcherPID,
                                          signalNumber: cancellationSignal
                                      )
                                  }
                              } catch {
                                  state.failure =
                                      "Could not publish GUI launcher PID: \(error)"
                                  _ = signalVerifiedLauncher(
                                      bundleIdentifier: bundleIdentifier,
                                      applicationURL: applicationURL,
                                      launcherPID: launcherPID,
                                      signalNumber: SIGTERM
                                  )
                              }
                          }
                      }
                  }
                  if !openProcess.isRunning {
                      break
                  }
                  Thread.sleep(forTimeInterval: 0.01)
              }
          }
          openProcess.waitUntilExit()
          let finalState = state.queue.sync {
              let launcherTerminated: Bool
              if let launcherPID = state.launcherPID {
                  launcherTerminated = signalVerifiedLauncher(
                      bundleIdentifier: bundleIdentifier,
                      applicationURL: applicationURL,
                      launcherPID: launcherPID,
                      signalNumber: 0
                  ) == launcherAbsentStatus
              } else {
                  launcherTerminated = true
              }
              if launcherTerminated {
                  state.launcherPID = nil
              } else if state.failure == nil {
                  state.failure =
                      "GUI launcher remained running after open waiter exited"
              }
              return (
                  cancellationStatus: state.cancellationStatus,
                  failure: state.failure,
                  launcherTerminated: launcherTerminated
              )
          }
          if finalState.launcherTerminated {
              _ = try? FileManager.default.removeItem(at: pidFileURL)
          }
          if let failure = finalState.failure {
              fputs("\(failure)\n", stderr)
          }
          if let cancellationStatus = finalState.cancellationStatus {
              exit(cancellationStatus)
          }
          if finalState.failure != nil {
              exit(1)
          }
          if openProcess.terminationReason == .uncaughtSignal {
              exit(128 + openProcess.terminationStatus)
          }
          exit(openProcess.terminationStatus)
          CONTROLLER
          /usr/bin/xcrun swiftc -O -framework AppKit \
            "$launch_controller_source" -o "$launch_controller"
          chmod 700 "$launch_controller"

          cat > "$launcher_script" <<'LAUNCHER'
          #!/bin/bash
          set -uo pipefail

          result_file=$1
          launcher_output=$2
          workspace=$3
          runner_path=$4
          runner_home=$5
          runner_tmpdir=$6
          fixed_user_home=$7
          developer_dir=$8
          state_root=$9
          xcframework_target=${10}
          zig=${11}
          runner_environment=${12}
          runner_temp=${13}
          runner_shell=${14}
          ci=${15}
          github_actions=${16}
          shift 16

          test_pid=
          pending_signal=
          signal_status=
          forward_signal() {
            local signal=$1
            pending_signal=$signal
            case "$signal" in
              INT) signal_status=130 ;;
              TERM) signal_status=143 ;;
              HUP) signal_status=129 ;;
            esac
            if [[ -n "$test_pid" ]]; then
              kill -"$signal" -- -"$test_pid" 2>/dev/null ||
                kill -"$signal" "$test_pid" 2>/dev/null || true
            fi
          }
          trap 'forward_signal INT' INT
          trap 'forward_signal TERM' TERM
          trap 'forward_signal HUP' HUP

          export PATH=$runner_path
          export HOME=$runner_home
          export TMPDIR=$runner_tmpdir
          export CFFIXED_USER_HOME=$fixed_user_home
          export DEVELOPER_DIR=$developer_dir
          export GHOSTHUB_CI_STATE_ROOT=$state_root
          export LIBGHOSTTY_XCFRAMEWORK_TARGET=$xcframework_target
          export LIBGHOSTTY_ZIG=$zig
          export RUNNER_ENVIRONMENT=$runner_environment
          export RUNNER_TEMP=$runner_temp
          export SHELL=$runner_shell
          export CI=$ci
          export GITHUB_ACTIONS=$github_actions
          export GHOSTHUB_TEST_STOP_GRACE=2

          cd -- "$workspace"
          set -m
          sh tools/run_swift_tests.sh "$@" > "$launcher_output" 2>&1 &
          test_pid=$!
          set +m

          while kill -0 "$test_pid" 2>/dev/null &&
            ! kill -0 -- -"$test_pid" 2>/dev/null
          do
            :
          done
          if [[ -n "$signal_status" ]]; then
            forward_signal "$pending_signal"
          fi

          set +e
          while :; do
            wait "$test_pid"
            test_status=$?
            if ! kill -0 "$test_pid" 2>/dev/null; then
              break
            fi
          done
          set -e
          if [[ -n "$signal_status" ]]; then
            test_status=$signal_status
          fi
          printf '%s\n' "$test_status" > "$result_file.tmp"
          mv -- "$result_file.tmp" "$result_file"
          exit "$test_status"
          LAUNCHER
          chmod 700 "$launcher_script"
          : > "$launcher_output"
          : > "$launcher_stdout"
          : > "$launcher_stderr"

          set -m
          "$launch_controller" \
            "$launcher_bundle_identifier" \
            "$launcher_app" \
            "$launcher_pid_file" \
            "$launcher_stdout" \
            "$launcher_stderr" \
            "$launcher_script" \
            "$result_file" \
            "$launcher_output" \
            "$GITHUB_WORKSPACE" \
            "$PATH" \
            "$HOME" \
            "$TMPDIR" \
            "$CFFIXED_USER_HOME" \
            "$DEVELOPER_DIR" \
            "$GHOSTHUB_CI_STATE_ROOT" \
            "$LIBGHOSTTY_XCFRAMEWORK_TARGET" \
            "$LIBGHOSTTY_ZIG" \
            "${RUNNER_ENVIRONMENT:-}" \
            "$RUNNER_TEMP" \
            "$SHELL" \
            "${CI:-}" \
            "${GITHUB_ACTIONS:-}" \
            "${test_arguments[@]}" &
          controller_pid=$!
          set +m
          set +e
          wait "$controller_pid"
          controller_status=$?
          set -e
          controller_pid=
          tee -a "$RUNNER_TEMP/gui-tests.log" < "$launcher_output"
          cat "$launcher_stdout"
          cat "$launcher_stderr" >&2
          if (( controller_status != 0 )); then
            echo "Could not launch serialized GUI tests in the Aqua session." >&2
            exit "$controller_status"
          fi
          if [[ ! -f "$result_file" ]]; then
            echo "Serialized GUI test launcher did not report a result." >&2
            exit 1
          fi
          test_status="$(< "$result_file")"
          if [[ ! "$test_status" =~ ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$ ]]; then
            echo "Serialized GUI test launcher reported an invalid result." >&2
            exit 1
          fi
          exit "$test_status"

      - name: Verify terminal smoke coverage
        shell: bash
        run: |
          gui_test_log="$RUNNER_TEMP/gui-tests.log"
          gui_skip_pattern='Test skipped'
          if grep -Ei "$gui_skip_pattern" "$gui_test_log"; then
            echo "Terminal smoke tests must not skip selected coverage." >&2
            exit 1
          fi

      - name: Run remaining XCTest suites
        # Keep deadline-sensitive monitor and lifecycle tests serialized.
        run: >-
          sh tools/run_swift_tests.sh
          swift test --skip-build --disable-swift-testing
          --skip GhosthubTerminalSmokeTests --no-parallel

      - name: Run Swift Testing suites
        run: >-
          sh tools/run_swift_tests.sh
          swift test --skip-build --disable-xctest --no-parallel

      - name: Run essential kwt and tmux workflows
        run: make test-essential-workflows

      - name: Remove isolated macOS test state
        if: ${{ always() && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          case "${GHOSTHUB_CI_STATE_ROOT:-}" in
            /tmp/ghosthub-ci.*) rm -rf -- "$GHOSTHUB_CI_STATE_ROOT" ;;
          esac
