name: Sandbox image merge signal

on:
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: sandbox-image-merge-signal-${{ github.sha }}
  cancel-in-progress: true

jobs:
  signal:
    name: Request fresh sandbox promotion authorization
    if: github.repository == 'kenn-io/ghosthub'
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
