name: macOS compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sequoia-release:
    name: Sequoia release bundle (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LIBGHOSTTY_XCFRAMEWORK_TARGET: native

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify Sequoia Apple Silicon runner
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "This job requires an Apple Silicon runner; found $(uname -m)." >&2
            exit 1
          fi
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          if [[ "$macos_major" != "15" ]]; then
            echo "This job requires macOS 15; found $(sw_vers -productVersion)." >&2
            exit 1
          fi
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Select Xcode 26.0.1
        shell: bash
        run: |
          XCODE_APP=/Applications/Xcode_26.0.1.app
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "Xcode 26.0.1 is not installed on the Sequoia runner." >&2
            ls -1 /Applications >&2
            exit 1
          fi
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$DEVELOPER_DIR" xcrun swift --version

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Zig 0.15.2
        shell: bash
        env:
          ZIG_VERSION: 0.15.2
          ZIG_SHA256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
        run: |
          archive="$RUNNER_TEMP/zig-${ZIG_VERSION}.tar.xz"
          install_root="$RUNNER_TOOL_CACHE/zig/${ZIG_VERSION}/arm64"
          curl --fail --silent --show-error --location \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          tar -xf "$archive" -C "$install_root" --strip-components=1
          echo "LIBGHOSTTY_ZIG=$install_root/zig" >> "$GITHUB_ENV"

      - name: Configure isolated test state
        shell: bash
        run: |
          umask 077
          state_root="$(mktemp -d "$RUNNER_TEMP/ghosthub-sequoia.XXXXXX")"
          foundation_home="$state_root/home"
          foundation_tmp="$state_root/tmp"
          mkdir -p "$foundation_home/Library/Caches" "$foundation_tmp"
          {
            echo "GHOSTHUB_CI_STATE_ROOT=$state_root"
            echo "CFFIXED_USER_HOME=$foundation_home"
            echo "TMPDIR=$foundation_tmp"
            echo "RELEASE_ROOT=$state_root/release"
          } >> "$GITHUB_ENV"

      - name: Verify build prerequisites
        shell: bash
        run: |
          "$LIBGHOSTTY_ZIG" version
          go version
          uv --version
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer \
            xcrun -sdk macosx metal --version

      - name: Build libghostty with Xcode 16.4 Metal compiler
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: make bootstrap-libghostty-release

      - name: Build release bundle on Sequoia
        run: make release-app

      - name: Verify packaged deployment targets
        shell: bash
        run: |
          app="$RELEASE_ROOT/Ghosthub.app"
          plist="$app/Contents/Info.plist"
          expected_minimum=15.0
          declared_minimum="$(plutil -extract LSMinimumSystemVersion raw -o - "$plist")"
          if [[ "$declared_minimum" != "$expected_minimum" ]]; then
            echo "Expected LSMinimumSystemVersion $expected_minimum; found $declared_minimum." >&2
            exit 1
          fi

          macho_count=0
          while IFS= read -r -d '' candidate; do
            if ! file -b "$candidate" | grep -q 'Mach-O'; then
              continue
            fi
            macho_count=$((macho_count + 1))
            if ! xcrun vtool -show-build "$candidate" | awk '
              $1 == "minos" {
                split($2, version, ".")
                if (version[1] > 15 || (version[1] == 15 && version[2] > 0)) {
                  exit 1
                }
                found = 1
              }
              END { if (!found) exit 1 }
            '; then
              echo "Mach-O deployment target exceeds $expected_minimum: $candidate" >&2
              xcrun vtool -show-build "$candidate" >&2
              exit 1
            fi
          done < <(find "$app" -type f -print0)

          if [[ "$macho_count" -eq 0 ]]; then
            echo "The release bundle contains no Mach-O binaries." >&2
            exit 1
          fi
          echo "Verified $macho_count packaged Mach-O deployment targets."

      - name: Run libghostty runtime smoke tests on Sequoia
        run: make smoke-test LIBGHOSTTY_OPTIMIZE=ReleaseFast
