name: website

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Private repo: the asset branch is unreachable from CI, and the
      # gate should still exercise the build. Production (Vercel) does
      # not set this and fails instead of deploying a placeholder.
      SYNC_ASSETS_ALLOW_PLACEHOLDER: '1'
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
