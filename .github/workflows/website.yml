name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'rust/web/assets/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'rust/web/assets/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Private repo: the asset branch is unreachable from CI, and the
      # gate should still exercise the build. Production (Vercel) does
      # not set this and fails instead of deploying a placeholder.
      SYNC_ASSETS_ALLOW_PLACEHOLDER: '1'
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399  # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - name: Upload Vitest JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-website-attempt-${{ github.run_attempt }}
          path: website/test-results/vitest/website.json
          retention-days: 14
          if-no-files-found: ignore
      - run: pnpm build
      - run: pnpm test:browser
      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-website-browser-attempt-${{ github.run_attempt }}
          path: website/test-results/playwright/website-browser.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Check that pages paint with their stylesheets and fonts
        uses: kenn-io/actions/first-paint@1791c94d02222ed022f31d41eab3118e4f4fcc15 # main
        with:
          dist: website/dist
