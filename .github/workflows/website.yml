name: website

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Private repo: the asset branch is unreachable from CI, and the
      # gate should still exercise the build. Production (Vercel) does
      # not set this and fails instead of deploying a placeholder.
      SYNC_ASSETS_ALLOW_PLACEHOLDER: '1'
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399  # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Check that pages paint with their stylesheets and fonts
        uses: kenn-io/actions/first-paint@b523fb403607f01de5eec5f4556c7668544c70fe # main
        with:
          dist: website/dist
