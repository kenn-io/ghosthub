name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # The build job only checks out source and uploads an Actions artifact.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_ROOT: .dist/release
  LIBGHOSTTY_XCFRAMEWORK_TARGET: native
  KWT_REPOSITORY: kenn-io/kwt

jobs:
  macos-release:
    name: Build, sign, and notarize
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 120
    environment:
      name: release-signing
    outputs:
      version: ${{ steps.release.outputs.version }}
      # $GITHUB_ENV does not cross jobs, so the revision this job actually
      # built has to be handed to publish-release explicitly.
      kwt-revision: ${{ steps.kwt-pin.outputs.revision }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Load pinned kwt revision
        id: kwt-pin
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < KWT_REVISION)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "KWT_REVISION must contain one full Git commit." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "KWT_REF=$revision" >> "$GITHUB_ENV"

      - name: Check out pinned kwt
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.KWT_REPOSITORY }}
          ref: ${{ steps.kwt-pin.outputs.revision }}
          path: .release-inputs/kwt-source
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "This release requires an Apple Silicon runner; found $(uname -m)." >&2
            exit 1
          fi
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select Xcode 26.0.1
        shell: bash
        run: |
          XCODE_APP=/Applications/Xcode_26.0.1.app
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "Xcode 26.0.1 is not installed on the hosted runner." >&2
            ls -1 /Applications >&2
            exit 1
          fi

          DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .release-inputs/kwt-source/go.mod
          cache-dependency-path: .release-inputs/kwt-source/go.sum
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Install Zig 0.15.2
        shell: bash
        env:
          ZIG_VERSION: 0.15.2
          ZIG_SHA256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
        run: |
          archive="$RUNNER_TEMP/zig-${ZIG_VERSION}.tar.xz"
          install_root="$RUNNER_TOOL_CACHE/zig/${ZIG_VERSION}/arm64"
          curl --fail --silent --show-error --location \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$install_root"
          tar -xf "$archive" -C "$install_root" --strip-components=1
          echo "$install_root" >> "$GITHUB_PATH"
          echo "LIBGHOSTTY_ZIG=$install_root/zig" >> "$GITHUB_ENV"

      - name: Derive release metadata
        id: release
        shell: bash
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          if [[ ! "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_VERSION must use X.Y.Z format; got $FILE_VERSION." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$FILE_VERSION" ]]; then
              echo "Tag version $VERSION does not match RELEASE_VERSION $FILE_VERSION." >&2
              exit 1
            fi
          else
            VERSION="$FILE_VERSION"
          fi
          {
            echo "version=$VERSION"
            echo "dmg_name=Ghosthub_${VERSION}_macos_$(uname -m).dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release changelog section
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_APP_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        # The appcast step runs this same extraction after signing and
        # notarization; validating here fails a bad changelog in seconds.
        run: |
          uv run --frozen python tools/extract_changelog.py \
            --changelog CHANGELOG.md \
            --version "$RELEASE_APP_VERSION" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$RELEASE_APP_VERSION" \
            --output /dev/null

      - name: Build pinned kwt helper
        shell: bash
        run: |
          kwt_binary="$RUNNER_TEMP/kwt"
          tools/build_pinned_kwt.sh \
            "https://github.com/$KWT_REPOSITORY.git" \
            "$KWT_REF" \
            "$GITHUB_WORKSPACE/.release-inputs/kwt-source" \
            "$kwt_binary"
          kwt_archs="$(lipo -archs "$kwt_binary")"
          if [[ "$kwt_archs" != "arm64" ]]; then
            echo "Embedded kwt must be an arm64 Mach-O; found: $kwt_archs" >&2
            file "$kwt_binary" >&2
            exit 1
          fi
          kwt_reported="$("$kwt_binary" version)"
          echo "$kwt_reported"
          kwt_version="$(printf '%s\n' "$kwt_reported" | sed -n '1s/^kwt version //p')"
          if [[ "$kwt_reported" != *"$KWT_REF"* ]]; then
            echo "Embedded kwt does not report the pinned revision $KWT_REF:" >&2
            echo "$kwt_reported" >&2
            exit 1
          fi
          {
            echo "KWT_BINARY_PATH=$kwt_binary"
            echo "KWT_VERSION=$kwt_version"
            echo "KWT_SOURCE_REVISION=$KWT_REF"
          } >> "$GITHUB_ENV"

      - name: Prepare Apple signing credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret $name is missing." >&2
              exit 1
            fi
          done

          CERT_PATH="$RUNNER_TEMP/apple-certificate.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 -D > "$NOTARY_KEY_PATH"

          KEYCHAIN_PATH="$RUNNER_TEMP/ghosthub-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 18)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          {
            echo "APPLE_CERTIFICATE_PATH=$CERT_PATH"
            echo "APPLE_NOTARY_KEY_FILE=$NOTARY_KEY_PATH"
            echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "APPLE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        env:
          RELEASE_APP_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DMG_NAME: ${{ steps.release.outputs.dmg_name }}
          KWT_SOURCE_DIR: ${{ github.workspace }}/.release-inputs/kwt-source
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: ./tools/build_release_dmg.sh

      - name: Generate checksums
        shell: bash
        run: |
          cd .dist/release
          shasum -a 256 ./*.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Generate signed update appcast
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_APP_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DMG_NAME: ${{ steps.release.outputs.dmg_name }}
          RELEASE_ROOT: ${{ env.RELEASE_ROOT }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: ./tools/generate_update_appcast.sh

      - name: Upload notarized candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ghosthub-${{ steps.release.outputs.version }}-candidate
          path: |
            .dist/release/*.dmg
            .dist/release/*.dmg.sha256
            .dist/release/SHA256SUMS
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload notarized release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ghosthub-${{ steps.release.outputs.version }}-notarized
          path: |
            .dist/release/*.dmg
            .dist/release/*.dmg.sha256
            .dist/release/SHA256SUMS
            .dist/release/appcast.xml
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi
          rm -f "${APPLE_CERTIFICATE_PATH:-}" "${APPLE_NOTARY_KEY_FILE:-}"

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: macos-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # This tag-only job publishes the notarized artifact.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download notarized artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Ghosthub-${{ needs.macos-release.outputs.version }}-notarized
          path: .dist/release

      - name: Build release notes
        shell: bash
        env:
          KWT_REF: ${{ needs.macos-release.outputs.kwt-revision }}
        run: |
          if [[ ! "$KWT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The build job did not report an embedded kwt revision." >&2
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse "${GITHUB_REF_NAME}^{}")
          TAG_BODY=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          BODY_PATH="$RUNNER_TEMP/release-body.md"
          {
            echo "Signed and notarized Ghosthub ${GITHUB_REF_NAME#v} for Apple Silicon."
            echo
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Embedded kwt revision: \`$KWT_REF\`"
            if [[ -n "$TAG_BODY" ]]; then
              echo
              echo "$TAG_BODY"
            fi
          } > "$BODY_PATH"
          echo "RELEASE_BODY_PATH=$BODY_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RELEASE_BODY_PATH" \
              --verify-tag
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RELEASE_BODY_PATH"

          gh release upload "$GITHUB_REF_NAME" \
            .dist/release/*.dmg \
            .dist/release/*.dmg.sha256 \
            .dist/release/SHA256SUMS \
            .dist/release/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
