name: Rust Port CI

on:
  push:
    branches: [main]
    paths:
      - rust/**
      - contracts/**
      - docs/rust-port.md
      - .github/workflows/rust-port.yml
      - Makefile
      - KWT_REVISION
      - KWT_GO_VERSION
      - tools/build_pinned_kwt.sh
      - tools/run_rust_ssh_fixture.sh
  pull_request:
    branches: [main]
    paths:
      - rust/**
      - contracts/**
      - docs/rust-port.md
      - .github/workflows/rust-port.yml
      - Makefile
      - KWT_REVISION
      - KWT_GO_VERSION
      - tools/build_pinned_kwt.sh
      - tools/run_rust_ssh_fixture.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Windows x86_64
            runner: windows-2025

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt

      - name: Restore Windows Rust cache
        if: runner.os == 'Windows'
        uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          workspaces: rust

      - name: Set up Go for the Linux KWT helper
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: KWT_GO_VERSION
          cache: false

      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apparmor-profiles \
            build-essential \
            bubblewrap \
            clang \
            cmake \
            fonts-dejavu-core \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            lld \
            llvm \
            mesa-vulkan-drivers \
            openssh-server \
            pkg-config \
            tmux \
            xauth \
            xvfb

      - name: Enable Bubblewrap namespaces on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --unshare-user --unshare-pid --unshare-net \
            --ro-bind / / --tmpfs /tmp --proc /proc --dev /dev --chdir / /bin/true

      - name: Set up uv for KWT helper validation
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build the pinned Linux KWT helper
        if: runner.os == 'Linux'
        run: make -C .. bootstrap-kwt bootstrap-kwt-variants

      - name: Stage Herdr for Linux acceptance
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/ghosthub-herdr"
          curl --fail --location --retry 3 \
            https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64 \
            --output "$RUNNER_TEMP/ghosthub-herdr/herdr"
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $RUNNER_TEMP/ghosthub-herdr/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/ghosthub-herdr/herdr"
          echo "HERDR_BINARY_PATH=$RUNNER_TEMP/ghosthub-herdr/herdr" >> "$GITHUB_ENV"

      - name: Build the pinned Zellij test helper
        if: runner.os == 'Linux'
        run: make -C .. bootstrap-zellij-test

      - name: Test and lint on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test-contracts --locked
          make -C .. rust-check
          xvfb-run -a make -C .. rust-test-fonts-live
          make -C .. rust-test-kwt-live KWT_BINARY_PATH=.build/kwt/kwt
          make -C .. rust-test-herdr-live
          make -C .. rust-test-zellij-live
          make -C .. rust-test-ssh-live

      - name: Test Linux protected pull-request worktrees
        if: runner.os == 'Linux'
        env:
          KWT_GITHUB_TOKEN: ${{ github.token }}
        run: make -C .. rust-test-kwt-pr-live KWT_BINARY_PATH=.build/kwt/kwt

      - name: Test and lint on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i" || exit /b 1
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64 || exit /b 1
          cargo fmt --all --check || exit /b 1
          cargo test-contracts --locked || exit /b 1
          cargo test --workspace --locked || exit /b 1
          cargo check --workspace --all-targets --locked || exit /b 1
          cargo clippy --workspace --all-targets --locked -- -D warnings || exit /b 1

  licenses:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policy
        run: make -C .. rust-deny

  web-first-paint:
    name: Web UI first paint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Build the web UI launcher
        run: cargo build --locked -p ghosthub-web --example serve

      # The launcher serves the same embedded page and CSP as the app. Its
      # HTTP checker uses its bearer credential instead of browser cookies.
      # This loopback-only process ends with the job.
      - name: Start the web UI
        id: serve
        run: |
          log="$RUNNER_TEMP/web-ui.log"
          target/debug/examples/serve > "$log" 2>&1 &
          url=""
          for _ in $(seq 100); do
            url="$(grep -o 'http://127\.0\.0\.1:[0-9]*/?auth_token=[0-9a-f]*' "$log" || true)"
            if [[ -n "$url" ]]; then break; fi
            sleep 0.1
          done
          if [[ -z "$url" ]]; then
            cat "$log"
            exit 1
          fi
          token="${url##*auth_token=}"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "url=${url%%\?*}" >> "$GITHUB_OUTPUT"

      - name: Check that the page paints with its stylesheets and fonts
        uses: kenn-io/actions/first-paint@5d46153e44375ef5ab11a3aaa1ad81ebcba0965c # authenticated system-font pages
        with:
          urls: ${{ steps.serve.outputs.url }}
          bearer-token: ${{ steps.serve.outputs.token }}
