name: Sandbox image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - images/sandbox/**
      - tools/sandbox_image.py
      - tools/sandbox_image/**
      - tools/tests/test_sandbox_image_*.py
      - .github/workflows/sandbox-image*.yml
permissions: {}

jobs:
  check:
    name: Validate sandbox image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: sandbox-image-check-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: '0.9.5'
          checksum: 2cf10babba653310606f8b49876cfb679928669e7ddaa1fb41fb00ce73e64f66
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build, test, and scan image
        run: make sandbox-image-check
      - name: Upload review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-image-evidence
          path: |
            .dist/sandbox-image/sandbox-image.spdx.json
            .dist/sandbox-image/sandbox-image.vulnerabilities.json
          if-no-files-found: error
