name: Sandbox image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - images/sandbox/**
      - tools/sandbox_image.py
      - tools/sandbox_image/**
      - tools/tests/test_sandbox_image_*.py
      - .github/workflows/sandbox-image*.yml
permissions: {}

jobs:
  check:
    name: Validate sandbox image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: sandbox-image-check-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - uses: step-security/setup-qemu-action@d21542abd2ae44772cf2276e75ee4ec531d598b6 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build, test, and scan image
        run: make sandbox-image-check
      - name: Upload review evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-image-evidence
          path: |
            .dist/sandbox-image/sandbox-image.spdx.json
            .dist/sandbox-image/sandbox-image.vulnerabilities.json
          if-no-files-found: error
