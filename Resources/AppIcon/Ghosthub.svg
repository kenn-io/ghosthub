<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ghosthub app icon: ghost terminal hub. Outline ghost with a shell
       prompt face ($ + block cursor, drawn as paths, no font dependency)
       and four spoke-and-node connectors for the session hub. -->
  <defs>
    <linearGradient id="gh-bg" x1="160" y1="120" x2="864" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#183245"/>
      <stop offset="1" stop-color="#0b131c"/>
    </linearGradient>
    <linearGradient id="gh-sig" x1="330" y1="300" x2="700" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bde8ff"/>
      <stop offset="1" stop-color="#7fd8ff"/>
    </linearGradient>
  </defs>

  <rect x="80" y="80" width="864" height="864" rx="220" fill="url(#gh-bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="220" fill="none"
    stroke="#3f6176" stroke-opacity="0.26" stroke-width="8"/>

  <g stroke="#85daf7" stroke-opacity="0.5" stroke-width="26" stroke-linecap="round">
    <line x1="240" y1="266" x2="286" y2="306"/>
    <line x1="784" y1="266" x2="738" y2="306"/>
    <line x1="240" y1="772" x2="284" y2="736"/>
    <line x1="784" y1="772" x2="740" y2="736"/>
  </g>
  <g fill="#d4f2ff">
    <circle cx="206" cy="236" r="34" fill-opacity="0.9"/>
    <circle cx="818" cy="236" r="34" fill-opacity="0.9"/>
    <circle cx="206" cy="800" r="34" fill-opacity="0.9"/>
    <circle cx="818" cy="800" r="34" fill-opacity="0.9"/>
  </g>

  <path d="M312 424 a200 200 0 0 1 400 0 v330 l-100 -68 -100 68 -100 -68 -100 68 Z"
    fill="none" stroke="#9de9ff" stroke-opacity="0.95" stroke-width="40"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- $ (Menlo Bold "dollar", converted to a path at 224px, baseline 530.9) -->
