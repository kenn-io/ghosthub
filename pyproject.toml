[project]
name = "ghosthub-python-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.16.3",
  "ty==0.0.71",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["./tools"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools/tests"]
